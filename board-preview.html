<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var origDefineProperty = Object.defineProperty;
        var initialNativeFetch = window.fetch;
        var customFetch;
        var hasCustomSet = false;
        Object.defineProperty = function(obj, prop, desc) {
          if (obj === window && prop === 'fetch') {
            var origGet = desc && desc.get;
            return origDefineProperty.call(Object, obj, prop, {
              configurable: true,
              enumerable: true,
              get: function() {
                if (hasCustomSet) return customFetch;
                return origGet ? origGet.call(window) : (customFetch || initialNativeFetch);
              },
              set: function(val) {
                customFetch = val;
                hasCustomSet = true;
              }
            });
          }
          return origDefineProperty.apply(this, arguments);
        };
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.configurable && !desc.set) {
            Object.defineProperty(window, 'fetch', desc);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
