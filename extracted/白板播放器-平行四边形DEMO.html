/* ============ 2. 抖动与坐标 ============ */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// 编译期冻结：同一 seed 每次 render 结果一致 —— 这是「幂等/可拖进度条」的前提
function jit(seed,n,amp){const r=mulberry32(seed);const a=[];for(let i=0;i<n;i++)a.push((r()-0.5)*2*amp);return a;}
function parseCoord(s){
  if(!s)return null;
  const m=String(s).trim().match(/\[\s*([\d.]+)\s*%?\s*,\s*([\d.]+)\s*%?\s*\]/);
  if(!m)return null;
  return {x:parseFloat(m[1]),y:parseFloat(m[2]),pct:String(s).indexOf('%')>=0};
}

/* ============ 3. 编译期：算全局时间轴 ============ */
function compile(data){
  const bp=data.boardPlan||{};
  const W=(bp.canvas&&bp.canvas.w)||1726, H=(bp.canvas&&bp.canvas.h)||980;
  let acc=0, guessed=false;
  const rows=(data.rows||[]).map((r,i)=>{
    let dur=r.estimatedDurationMs;
    if(typeof dur!=="number"||dur<=0){
      dur=Math.max(1000,Math.round((r.speech||"").replace(/\s/g,"").length*60/160*1000));
      guessed=true;   // 没有真值只能猜 —— 这就是 8 倍错配的来源
    }
    const plan=r.exclusiveExecutionPlan||[];
    const maxEnd=plan.reduce((m,t)=>Math.max(m,(t.endOffsetMs!=null?t.endOffsetMs:(t.startOffsetMs||0)+(t.durationMs||0))),0);
    if(maxEnd>dur)dur=maxEnd;   // 防止被截断
    // 优先用上游 estimatedStartMs/EndMs（含 1500ms 行间隔），没有才本地累加
    const hasTs=typeof r.estimatedStartMs==='number'&&typeof r.estimatedEndMs==='number';
    const startMs=hasTs?r.estimatedStartMs:acc;
    const o={i:i,row:r,startMs:startMs,durMs:dur,plan:plan};
    acc=hasTs?r.estimatedEndMs:(acc+dur); return o;
  });
  return {W:W,H:H,rows:rows,total:acc,guessed:guessed,data:data};
}

/* ============ 4. rough 手绘（纯 Canvas，无外部依赖） ============ */
function rline(ctx,x1,y1,x2,y2,seed,amp){
  const n=Math.max(6,Math.round(Math.hypot(x2-x1,y2-y1)/18));
  const j=jit(seed,n+1,amp||1.6);
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const t=i/n, x=x1+(x2-x1)*t, y=y1+(y2-y1)*t;
    const nx=-(y2-y1), ny=(x2-x1), L=Math.hypot(nx,ny)||1;
    const d=j[i]*(i===0||i===n?0.35:1);
    const px=x+nx/L*d, py=y+ny/L*d;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke();
}
function rrect(ctx,x,y,w,h,seed){
  const A=jit(seed,4,2.2);
  rline(ctx,x+A[0],y+A[1],x+w+A[1],y+A[2],seed+11);
  rline(ctx,x+w+A[1],y+A[2],x+w+A[3],y+h+A[0],seed+22);
  rline(ctx,x+w+A[3],y+h+A[0],x+A[2],y+h+A[1],seed+33);
  rline(ctx,x+A[2],y+h+A[1],x+A[0],y+A[1],seed+44);
}
function rellipse(ctx,cx,cy,rx,ry,seed){
  const n=34, j=jit(seed,n,3.2);
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const a=i/n*Math.PI*2.06;              // 略过一点，留「没画满」的手感
    const k=1+j[i]/Math.max(rx,ry);
    const x=cx+Math.cos(a)*rx*k, y=cy+Math.sin(a)*ry*k;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
}

/* ============ 5. 排版：记每个字的坐标，供 action 定位 exactText ============ */
// 规格真相源：手写区字体 = LikeJianJianTi（在线 @import，离线回退楷体）
const HAND_FONT='"LikeJianJianTi","PING FANG SAN SHENG","平方乔木体","PING FANG CHANG AN",KaiTi,STKaiti,"PingFang SC",serif';
// 规格真相源：题目区是印刷体，不吃手写字体
const PRINT_FONT='"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
// 规格真相源：分析区红笔，解答/总结黑笔（题目区不走手写渲染）
const STAGE_COLOR={'题目':'#000000','分析':'#dc2626','解答':'#000000','总结':'#000000'};
function layoutText(ctx,text,x,y,maxW,size,lh,font){
  ctx.font=size+'px '+(font||HAND_FONT);
  const lines=[]; let cur="", ly=y;
  for(const ch of String(text)){
    if(ch==="\n"){lines.push({t:cur,y:ly});cur="";ly+=lh;continue;}
    const t=cur+ch;
    if(ctx.measureText(t).width>maxW&&cur){lines.push({t:cur,y:ly});cur=ch;ly+=lh;}
    else cur=t;
  }
  if(cur)lines.push({t:cur,y:ly});
  const chars=[];
  lines.forEach((L,li)=>{let cx=x;for(const ch of L.t){const w=ctx.measureText(ch).width;chars.push({ch:ch,x:cx,y:L.y,w:w,li:li});cx+=w;}});
  return {lines:lines,chars:chars,endY:ly+lh};
}
function findRange(chars,sub,occ){
  if(!sub)return null;                // 防御：空串不再匹配（rough-line/arrow 无 target，曾致 chars[-1] 崩溃）
  occ=occ||1; let hit=0;
  for(let i=0;i+sub.length<=chars.length;i++){
    let ok=true;
    for(let k=0;k<sub.length;k++) if(chars[i+k].ch!==sub[k]){ok=false;break;}
    if(ok){hit++; if(hit===occ){
      const a=chars[i], b=chars[i+sub.length-1];
      return {x1:a.x,y1:a.y,x2:b.x+b.w,y2:b.y};}}
  }
  return null;
}

/* ============ 5b. 预渲染：一行一张图（离屏 canvas + 斜边遮罩揭示） ============ */
// 机制搬自旧作 src.zip / AutoHandwritingLayer.tsx：「整块渲染成贴纸图 + 斜梯形遮罩按 progress 揭示」
// 粒度不搬：旧版一个 row 一整块（row 内多行同时显影，破串行）；我们一行一张图，串行铁律才成立
// 收益：运行时只做 clip + drawImage → 零开销、可 seek、录屏不掉帧；且「只要能出图，公式/字体/抖动全是图」
// 旧作是 min(2,dpr)→低清屏只有 1x，录屏会糊；这里取「下限 2、上限 3」：高清保证，也不至于爆内存
const DPR=Math.max(2,Math.min(3,window.devicePixelRatio||1));
let FONT_VER=0;                                     // 字体异步加载完成后 +1 → 缓存整体作废
const ROW_CACHE=new Map();                          // Map 保插入序 → LRU 淘汰可直接取首个 key
let SCRATCH=null;                                   // 羽化合成用，全屏尺寸只建一张、反复复用
function getScratch(W,H){
  if(!SCRATCH)SCRATCH=document.createElement('canvas');
  if(SCRATCH.width!==W||SCRATCH.height!==H){SCRATCH.width=W;SCRATCH.height=H;}
  return SCRATCH;
}
// 一行一张图：bbox 用主画布绝对像素记，运行时 drawImage 直接对齐，不做任何偏移换算
// 三路抖动抄自旧作 renderBoardTextStickerImage.ts（字号/基线/字距）——领地 E 的美学我们缺的正是这个。
// 旧版只有这三路（无位置抖动）；我们保留自己原有的位置抖动，两边叠加，别互相覆盖
const GLYPH_FONT_JITTER=0.045;      // 旧版 0.045：字号 ±4.5%
const GLYPH_BASELINE_JITTER=0.05;   // 旧版 0.08，38px 下 ±3px 偏大，取 0.05
const GLYPH_SPACING_JITTER=0.05;    // 旧版 0.08，同上收一档
const MAX_ROW_CACHE=120;            // LRU 上限（旧版 100）
const MCTX=(function(){const c=document.createElement('canvas');return c.getContext('2d');})();  // 只用于量字宽
function rowImage(o){
  const key=[o.content,o.li,o.x|0,o.y|0,o.size,o.font,o.color,FONT_VER,DPR].join('|');
  const hit=ROW_CACHE.get(key);
  if(hit){ROW_CACHE.delete(key);ROW_CACHE.set(key,hit);return hit;}   // 命中即提到队尾（LRU）
  // 逐字 layout：字号 / 基线 / 字距三路抖动 + 我们原有的位置抖动，全部由 seed 派生 → 幂等
  const rnd=mulberry32(o.seed+o.li*7919+13);
  const gs=[]; let cx=o.x, idx=o.chIdx0;
  for(const ch of o.text){
    const fs=Math.max(12,Math.round(o.size*(1+(rnd()*2-1)*GLYPH_FONT_JITTER)));
    MCTX.font=fs+'px '+o.font;
    const w=Math.max(1,MCTX.measureText(ch).width);
    const jx=jit(o.seed+idx,1,o.amp)[0], jy=jit(o.seed+idx+7777,1,o.amp)[0];
    const dy=(rnd()*2-1)*o.size*GLYPH_BASELINE_JITTER;
    gs.push({ch:ch,fs:fs,x:cx,w:w,y:o.y+dy+jy,jx:jx});
    cx+=w+(/\s/.test(ch)?0:(rnd()*2-1)*o.size*GLYPH_SPACING_JITTER);   // 空格不吃字距抖动（旧版同款细节）
    idx++;
  }
  const lw=Math.max(o.size,cx-o.x);
  const pad=Math.ceil(4+o.amp+o.size*GLYPH_BASELINE_JITTER);
  const bx=Math.floor(o.x-pad), by=Math.floor(o.y-o.size*1.15-pad);
  const bw=Math.ceil(lw)+pad*2, bh=Math.ceil(o.size*1.6)+pad*2;
  const c=document.createElement('canvas');
  c.width=Math.ceil(bw*DPR); c.height=Math.ceil(bh*DPR);
  const g=c.getContext('2d');
  g.scale(DPR,DPR); g.translate(-bx,-by);             // 把主画布坐标系搬进离屏
  g.textBaseline='alphabetic'; g.fillStyle=o.color;
  for(const gl of gs){ g.font=gl.fs+'px '+o.font; g.fillText(gl.ch,gl.x+gl.jx,gl.y); }
  const r={img:c,bx:bx,by:by,bw:bw,bh:bh,w:lw};
  if(ROW_CACHE.size>=MAX_ROW_CACHE)ROW_CACHE.delete(ROW_CACHE.keys().next().value);
  ROW_CACHE.set(key,r); return r;
}

/* ============ 5c. 板书文本规范化与路由（融合自旧作 boardSticker） ============ */
// 旧作最值钱的一条经验：小学题的「公式」绝大多数能转 Unicode 用手写字体直接写（保住手写感），
// 只有真·结构数学（\frac、多层上下标）才值得出公式图。我们暂无 KaTeX，先降级为「原样写 + 告警」。
// ⚠ 旧作 2026-06-08 的坑：/\s+/g 含 \n，会把多行板书压成一行 → 这里只压行内空白，绝不碰 \n
const LATEX2U=[
  [/\\times\b/g,'×'],[/\\div\b/g,'÷'],[/\\cdot\b/g,'·'],
  [/\^\s*\{?\s*\\circ\s*\}?/g,'°'],[/\\circ\b/g,'°'],[/\\degree\b/g,'°'],   // ^\circ 必须先于裸 \circ，否则留孤立 ^
  [/\\angle\b/g,'∠'],[/\\pm\b/g,'±'],[/\\perp\b/g,'⊥'],[/\\parallel\b/g,'∥'],
  [/\\triangle\b/g,'△'],[/\\therefore\b/g,'∴'],[/\\because\b/g,'∵'],
  [/\\le(?:q)?\b/g,'≤'],[/\\ge(?:q)?\b/g,'≥'],[/\\ne(?:q)?\b/g,'≠'],[/\\approx\b/g,'≈'],
  [/\\pi\b/g,'π'],[/\\infty\b/g,'∞'],[/\\sqrt\s*\{([^}]*)\}/g,'√$1'],[/\\sqrt\b/g,'√'],
  [/\\rightarrow\b/g,'→'],[/\\Rightarrow\b/g,'⇒'],[/\\to\b/g,'→']
];
// 结构数学：LaTeX 命令 / ^_{...} / 连续上下标 —— 手写字体写不了，需要公式图
const STRUCT_MATH=/\\[a-zA-Z]+|[A-Za-z0-9)\]}]\s*[\^_]\s*\{[^}]+\}|[A-Za-z0-9)\]}]\s*[\^_]\s*[A-Za-z0-9]\s*[\^_]/;
const FORMULA_LINES=new Set();     // 命中结构数学的行，渲染后统一提示（提示即缺口清单，不静默丢）
// ① 转义层：模型输出经 JSON/LLM 转义后常见的两类损伤，先修再规范化（顺序不能倒）
//   a) LaTeX 转义损伤：\frac 被吃成 rac / frac（旧作 repairCommonLatexEscapeDamage 同款）
function repairCommonLatexEscapeDamage(t){
  return t.replace(/\u000c\s*rac/g,'\\frac')                      // 换页符+rac → \frac
          .replace(/(^|[^A-Za-z\\])rac(?=\s*\{)/g,'$1\\frac')
          .replace(/(^|[^A-Za-z\\])frac(?=\s*\{)/g,'$1\\frac');
}
//   b) HTML 实体：剥标签后残留 &amp; 会字面落板。⚠ &amp; 必须最后解，否则 &amp;lt; 会被二次解成 <
function decodeHtmlEntities(t){
  return t.replace(/&times;/g,'×').replace(/&divide;/g,'÷').replace(/&minus;/g,'−')
          .replace(/&plusmn;/g,'±').replace(/&deg;/g,'°').replace(/&le;/g,'≤')
          .replace(/&ge;/g,'≥').replace(/&ne;/g,'≠').replace(/&middot;/g,'·')
          .replace(/&mdash;/g,'—').replace(/&hellip;/g,'…')
          .replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
          .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
}
function normalizeBoardLine(s){
  let t=String(s==null?'':s);
  t=decodeHtmlEntities(t);
  t=repairCommonLatexEscapeDamage(t);
  t=t.replace(/\$+/g,'');                     // 安全网：$ 绝不字面落板（旧作 2026-06-07 护栏）
  t=t.replace(/\\left\b|\\right\b/g,'');
  for(let i=0;i<LATEX2U.length;i++)t=t.replace(LATEX2U[i][0],LATEX2U[i][1]);
  t=t.replace(/[\t ]+/g,' ').trim();          // 只压行内空白；\n 由调用方 split 保留
  return t;
}

/* ============ 6. 渲染核心 ============ */
const cv=document.getElementById('board'), ctx=cv.getContext('2d');
const tlc=document.getElementById('tl'), tlx=tlc.getContext('2d');
const audioEl=document.getElementById('audio');
let C=null, T=0, playing=false, rafId=0, lastTs=0, hasAudio=false;

// 内嵌素材加载（data URI 同步解码前先建 Image，onload 后重绘一次）
const IMG={canvas:new Image(),icons:{}};
IMG.canvas.src=ASSET.canvas;
for(const k in ASSET.icons){const im=new Image();im.src=ASSET.icons[k];IMG.icons[k]=im;}
IMG.canvas.onload=()=>{if(C)render(now());};
for(const k in IMG.icons)IMG.icons[k].onload=()=>{if(C)render(now());};

// stage 贴纸标签：该 stage 首行开始时「啪」地贴上（180ms 弹出），题目标签考卷式 t=0 常驻
// 锚点用内容锚（该 stage 首个 board 任务的落笔点上方），比区域角鲁棒——标签即这段板书的段落标题
function drawStageTag(stage,t,W,H){
  const ic=IMG.icons[stage]; if(!ic||!ic.complete||!ic.naturalWidth)return;
  let ax=6, ay=12, first=Infinity, hasBoardAnchor=false;   // 兜底：question 区域角
  for(const r of C.rows)if(r.row.stage===stage&&r.startMs<first){
    first=r.startMs;
    const b=r.plan.find(k=>k.type==='board');
    const coordStr = b ? (b.coord || b.startCoord || r.row?.board?.startCoord) : null;
    const co=(b&&String(b.content||'').trim()&&!/^<[^>]+>$/.test(String(b.content).replace(/<br\s*\/?>/gi,'').replace(/<[^>]+>/g,'').trim()))?parseCoord(coordStr):null;
    if(co){ax=co.pct?co.x:co.x/W*100; ay=co.pct?co.y:co.y/H*100; hasBoardAnchor=true;}
    else{
      hasBoardAnchor=false;
      if(stage==='题目'){ax=2.5;ay=5;}               // 题目标签浮在画布左上角（旧作布局：tag-q 在题目区外上方），不压考卷原文
      else{
        const key={'题目':'question','分析':'analysis','解答':'solution','总结':'summary'}[stage];
        const z=(C.data.boardPlan||{})[key]; if(z){ax=z.x;ay=z.y;}
      }
    }
  }
  if(stage==='题目')first=0;
  if(t<first)return;
  const el=t-first, pop=el<180?1+0.18*(1-el/180):1;   // 弹出曲线由 t 决定 —— 幂等可 seek
  const w=ic.width*pop, h=ic.height*pop;
  let y;
  if(hasBoardAnchor){y=H*ay/100-32-h*1.1;}          // coord.y 是 baseline（字顶≈baseline-0.85em），标签贴字顶上方
  else{y=H*ay/100+4;}                                // 区域锚：贴区域内部顶端
  y=Math.max(y,H*SAFE.top/100+4);                   // 不顶出板面安全区
  ctx.drawImage(ic,W*ax/100,y,w,h);
}

// 时间真相源（991/timing.js）：板书 BASE_CHAR_MS/字 · 行间抬笔 HAND_LIFT_MS
// ⚠ 冲突待拍板：boardToolTiming.js 的 MIN_HAND_LIFT_GAP_MS=1000（此处取 timing.js 的 600）
const BASE_CHAR_MS=400, HAND_LIFT_MS=600;
const FEATHER_PX=2;   // 笔尖羽化：纯 clip 切口是硬的，抹一条软边更像笔推进（成本极低）

function drawWriting(task,p,W,H,stage){
  const coordStr = task.coord || task.startCoord || null;
  const co=parseCoord(coordStr)||{x:8,y:44,pct:true};
  const x=co.pct?W*co.x/100:co.x, y=co.pct?H*co.y/100:co.y;
  const size=38;                                   // 规格：手写区 38px
  ctx.font=size+'px '+HAND_FONT; ctx.textBaseline='alphabetic';
  const color=STAGE_COLOR[stage]||'#000000';       // 规格：分析红，解答/总结黑
  // board 内容是 HTML（<b>/<br> 等）：<br> 转换行，其余标签剥掉（timing.js 统计时同样剥）
  const raw=String(task.content||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');
  // 逐行规范化：LaTeX→Unicode、$ 剥离；\n 已在 split 后保留（不压行）
  const lines=raw.split('\n').map(normalizeBoardLine);
  lines.forEach(l=>{if(STRUCT_MATH.test(l))FORMULA_LINES.add(l);});
  const seed=hashStr(task.content||'');
  // 规格：行高均值 1.7，逐行 1.55~1.85 微小随机 —— seed 冻结，幂等可 seek
  const lhJ=jit(seed+1,lines.length,0.15).map(d=>1.7+d);
  // 规格：板书 1秒2-3字，每行 ±10% 抖动 → 行配速系数 0.9~1.1
  const spJ=jit(seed+2,lines.length,0.10).map(d=>1+d);

  // ★ 区间端点不动（互斥不破），只在区间内重分配：
  //   写 = 字符数 × 行配速，行与行之间 = 抬笔（timing.js 原公式只有前项，多行板书会低估）
  const seg=[]; let ci=0;
  lines.forEach((l,li)=>{
    seg.push({t:'w',li:li,text:l,ci:ci,w:Math.max(1,l.length)*spJ[li]});
    ci+=l.length;
    if(li<lines.length-1)seg.push({t:'l',w:HAND_LIFT_MS/BASE_CHAR_MS});   // 600/400 = 1.5 个字的等价权重
  });
  const totalW=seg.reduce((a,s)=>a+s.w,0);
  const shown=p*totalW;
  let acc=0;
  const sc=getScratch(W,H), sg=sc.getContext('2d');
  for(const s of seg){
    const w0=acc; acc+=s.w;
    if(shown<=w0)break;
    if(s.t==='l')continue;                          // 抬笔期间画面静止（手在空中走位）
    if(!s.text)continue;
    const pr=Math.min(1,(shown-w0)/s.w);            // 该行局部进度
    const ly=y+s.li*size*lhJ[s.li];
    const R=rowImage({content:String(task.content||''),li:s.li,text:s.text,x:x,y:ly,size:size,
                      font:HAND_FONT,color:color,seed:seed,chIdx0:s.ci,amp:1.2});
    // 揭示进度必须按「含字距抖动的真实行宽」映射，否则 pr=1 时行尾几个字永远揭不出来
    const lw=R.w;
    // 斜边斜率按行随机 2%~5%（旧作写死 3%，固定值看多了会假），方向也随机，别永远同向
    const rnd=mulberry32(seed+31+s.li);
    const sl=0.02+rnd()*0.03, dir=rnd()<0.5?-1:1;
    // 顶边比底边超前（旧作 top+1.8% / bottom-1.2%，约 1.5:1）→ 切出一条斜推进边
    const at=pr+(dir>0?sl:-sl*0.6), ab=pr+(dir>0?-sl*0.6:sl);
    const xA=R.bx-4, xB=R.bx+R.bw+4, yT=R.by-4, yB=R.by+R.bh+4;
    const xt=Math.max(xA,Math.min(xB,x+lw*at));
    const xb=Math.max(xA,Math.min(xB,x+lw*ab));
    // 揭示：只清这一小块、只贴这一小块，不做全屏合成
    sg.clearRect(R.bx,R.by,R.bw,R.bh);
    sg.save();
    sg.beginPath();
    sg.moveTo(xA,yT); sg.lineTo(xt,yT); sg.lineTo(xb,yB); sg.lineTo(xA,yB); sg.closePath();
    sg.clip();
    sg.drawImage(R.img,R.bx,R.by,R.bw,R.bh);
    sg.restore();
    if(FEATHER_PX>0){                                // 沿切口法线抹一条软边（切口是直线，等值线平行切口，整条带都对）
      const dx=xt-xb, dy=yB-yT, L=Math.hypot(dx,dy)||1;
      const nx=dy/L, ny=-dx/L, mx=(xt+xb)/2, my=(yT+yB)/2, F=FEATHER_PX;
      const gr=sg.createLinearGradient(mx-nx*F,my-ny*F,mx+nx*F,my+ny*F);
      gr.addColorStop(0,'rgba(0,0,0,0)');
      gr.addColorStop(0.5,'rgba(0,0,0,0.55)');
      gr.addColorStop(1,'rgba(0,0,0,0)');
      sg.globalCompositeOperation='destination-out';
      sg.fillStyle=gr; sg.fillRect(R.bx,R.by,R.bw,R.bh);
      sg.globalCompositeOperation='source-over';
    }
    ctx.drawImage(sc,R.bx,R.by,R.bw,R.bh,R.bx,R.by,R.bw,R.bh);
  }
}

function drawAction(task,p,Q,W,H){
  const a=task.action||{};
  // ── rough-line / rough-arrow：百分比坐标动作，不依赖文字定位（规范 5.3/5.4）──
  const tool=a.tool||'';
  if(tool==='rough-line'||tool==='rough-arrow'){
    const st=a.start||[0,0], en=a.end||[0,0];
    const x1=W*st[0]/100, y1=H*st[1]/100, x2=W*en[0]/100, y2=H*en[1]/100;
    const red=(a.style&&a.style.colorId)==='red';
    ctx.strokeStyle=red?'#dc2626':'#1a1a1a';
    ctx.lineWidth=(a.style&&a.style.strokeWidthId)==='emphasis'?4:2.5;
    ctx.globalAlpha=0.9;
    const ex=x1+(x2-x1)*p, ey=y1+(y2-y1)*p;      // 逐段生长，p 由上游时长钉死
    rline(ctx,x1,y1,ex,ey,hashStr(JSON.stringify(a.start)+JSON.stringify(a.end)),2.0);
    if(tool==='rough-arrow'&&p>0.9){              // 箭头头部在收笔时出现
      const ang=Math.atan2(y2-y1,x2-x1), L=14;
      ctx.beginPath();
      ctx.moveTo(ex,ey); ctx.lineTo(ex-L*Math.cos(ang-0.45),ey-L*Math.sin(ang-0.45));
      ctx.moveTo(ex,ey); ctx.lineTo(ex-L*Math.cos(ang+0.45),ey-L*Math.sin(ang+0.45));
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    return;
  }
  // ── rough-notation：文字标记，锚定 board/题目原文 ──
  const tg=a.target||{};
  const rg=findRange(Q.chars,tg.exactText||'',tg.occurrence||1);
  if(!rg)return;
  const seed=hashStr(tg.exactText||'');
  const act=a.action||'underline';
  // 动作是「视觉逗号」：p 从 0→1 生长，时长由上游钉死（1.2~1.5s）
  if(act==='underline'){
    ctx.strokeStyle='#dc2626'; ctx.lineWidth=3; ctx.globalAlpha=0.9;
    rline(ctx,rg.x1,rg.y1+8,rg.x1+(rg.x2-rg.x1)*p,rg.y1+8,seed,2.0);
    ctx.globalAlpha=1;
  }else if(act==='box'){
    ctx.strokeStyle='#dc2626'; ctx.lineWidth=3; ctx.globalAlpha=0.9;
    const w=(rg.x2-rg.x1)*p, h=44*p;
    rrect(ctx,rg.x1-6,rg.y1-34,w+12,h,seed);
    ctx.globalAlpha=1;
  }else if(act==='circle'){
    ctx.strokeStyle='#dc2626'; ctx.lineWidth=3; ctx.globalAlpha=0.9;
    const w=rg.x2-rg.x1, cx=rg.x1+w/2, cy=rg.y1-14;
    rellipse(ctx,cx,cy,w/2*p+8,26*p,seed);
    ctx.globalAlpha=1;
  }else if(act==='highlight'){
    ctx.fillStyle='rgba(250,204,21,0.45)';
    const w=(rg.x2-rg.x1)*p;
    ctx.fillRect(rg.x1-4,rg.y1-32,w+8,42);
  }
}

const SHOW_GRID=false;   // 调试用四区参考框，默认关（真品外观）
function render(t){
  const W=C.W,H=C.H;
  ctx.clearRect(0,0,W,H);
  // 板面色：底图板面区是透明挖空，透出这层浅纸白（规格黑字/红字在此底上成立）
  ctx.fillStyle='#fbfaf6'; ctx.fillRect(0,0,W,H);

  if(SHOW_GRID){
    const bp=C.data.boardPlan||{};
    ctx.save(); ctx.setLineDash([6,8]); ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=2;
    ['question','analysis','solution','summary'].forEach(k=>{
      const z=bp[k]; if(!z)return;
      ctx.strokeRect(W*z.x/100,H*z.y/100,W*z.w/100,H*z.h/100);
    });
    ctx.restore();
  }

  // 题目原文（静态，考卷式：一打开就有），规格 30px 印刷体 黑色 行高1.65
  const bp=C.data.boardPlan||{};
  const q=bp.question||{x:6,y:12,w:42,h:26};
  const Q=layoutText(ctx,C.data.problemText||'',W*q.x/100,H*q.y/100+40,W*q.w/100,30,30*1.65,PRINT_FONT);
  ctx.fillStyle='#000000'; ctx.font='30px '+PRINT_FONT; ctx.textBaseline='alphabetic';
  Q.lines.forEach(L=>ctx.fillText(L.t,W*q.x/100,L.y));

  // 逐行：给定 t 算局部进度 —— 幂等，可 seek
  let sub='', subP=0;
  for(const row of C.rows){
    const lt=t-row.startMs;
    if(lt<0)continue;
    for(const k of row.plan){
      const local=lt-(k.startOffsetMs||0);
      if(local<0)continue;
      const p=Math.min(1,local/(k.durationMs||1));
      if(k.type==='board'&&p>0)drawWriting(k,p,W,H,row.row.stage);
      else if(k.type==='action'&&p>0)drawAction(k,p,Q,W,H);
    }
    if(lt>=0&&lt<row.durMs){
      const sp=row.plan.find(x=>x.type==='speech');
      sub=(sp&&sp.text)||row.row.speech||'';
      subP=Math.min(1,lt/row.durMs);
    }
  }
  // 贴纸边框层最后画：板书万一越界会被边框盖住（贴纸压在字上的真实手感）
  if(IMG.canvas.complete&&IMG.canvas.naturalWidth)ctx.drawImage(IMG.canvas,0,0,W,H);
  for(const s of ['题目','分析','解答','总结'])drawStageTag(s,t,W,H);
  // 字幕
  const n=Math.floor(sub.length*subP);
  document.getElementById('sub').innerHTML=
    '<span>'+esc(sub.slice(0,n))+'</span><span class="rest">'+esc(sub.slice(n))+'</span>';
  drawTimeline(t);
  document.getElementById('time').textContent=(t/1000).toFixed(2)+' / '+(C.total/1000).toFixed(2)+' s';
  document.getElementById('seek').value=String(Math.round(t/C.total*1000));
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function drawTimeline(t){
  const w=tlc.width,h=tlc.height;
  tlx.clearRect(0,0,w,h);
  const pad=10, rowH=(h-pad*2)/Math.max(1,C.rows.length);
  C.rows.forEach((row,ri)=>{
    const y=pad+ri*rowH+rowH*0.25, bh=rowH*0.5;
    tlx.fillStyle='#f1f5f9'; tlx.fillRect(pad,y+2,w-pad*2,bh-4);
    row.plan.forEach(k=>{
      const x1=pad+(w-pad*2)*(row.startMs+(k.startOffsetMs||0))/C.total;
      const x2=pad+(w-pad*2)*(row.startMs+((k.endOffsetMs!=null)?k.endOffsetMs:(k.startOffsetMs||0)+(k.durationMs||0)))/C.total;
      tlx.fillStyle=k.type==='board'?'#2563eb':k.type==='action'?'#ea580c':'#16a34a';
      tlx.globalAlpha=k.type==='speech'?0.22:0.9;
      tlx.fillRect(x1,y,Math.max(2,x2-x1),bh);
      tlx.globalAlpha=1;
    });
    tlx.fillStyle='#64748b'; tlx.font='11px sans-serif';
    tlx.fillText(row.row.stage||'',pad+w-36,y+bh-1);
  });
  const px=pad+(w-pad*2)*(t/C.total);
  tlx.strokeStyle='#dc2626'; tlx.lineWidth=2;
  tlx.beginPath(); tlx.moveTo(px,0); tlx.lineTo(px,h); tlx.stroke();
}

/* ============ 7. 时钟：audio 优先 ============ */
function now(){ return hasAudio? audioEl.currentTime*1000 : T; }
function loop(ts){
  if(!playing){rafId=0;return;}
  if(!hasAudio){
    if(!lastTs)lastTs=ts;
    T+=ts-lastTs; lastTs=ts;
    if(T>=C.total){T=C.total;render(T);pause();return;}
  }
  render(now());
  rafId=requestAnimationFrame(loop);
}
function play(){
  if(!C)return;
  if(T>=C.total)T=0;
  playing=true; lastTs=0;
  document.getElementById('btnPlay').textContent='⏸ 暂停';
  if(hasAudio)audioEl.play();
  if(!rafId)rafId=requestAnimationFrame(loop);
}
function pause(){
  playing=false; lastTs=0;
  document.getElementById('btnPlay').textContent='▶ 播放';
  if(hasAudio)audioEl.pause();
}

/* ============ 8. 装载与校验 ============ */
function validate(data){
  const e=[],w=[];
  if(!data.apiSpecVersion)w.push('缺 apiSpecVersion');
  (data.rows||[]).forEach((r,i)=>{
    const plan=r.exclusiveExecutionPlan||[];
    const B=[],A=[];
    plan.forEach(k=>{
      const s=k.startOffsetMs||0, en=(k.endOffsetMs!=null)?k.endOffsetMs:s+(k.durationMs||0);
      if(k.type==='board')B.push([s,en]); else if(k.type==='action')A.push([s,en]);
    });
    B.forEach(b=>A.forEach(a=>{
      if(b[0]<a[1]&&a[0]<b[1])e.push('rows['+i+'] 违反单手互斥：board['+b+'] ∩ action['+a+']');
    }));
    const all=B.concat(A).sort((x,y)=>x[0]-y[0]);
    for(let k=1;k<all.length;k++){
      const gap=all[k][0]-all[k-1][1];
      if(gap>=0&&gap<400)w.push('rows['+i+'] 换手缓冲仅 '+gap+'ms（建议≥400）');
    }
    const bd=r.board||{};
    if(bd.startDelay!=null&&B.length&&Math.abs(bd.startDelay*1000-B[0][0])>100)
      w.push('rows['+i+'] startDelay('+bd.startDelay*1000+'ms) 与 plan 起笔('+B[0][0]+'ms) 不一致');
  });
  return {e:e,w:w};
}
function load(data){
  C=compile(data);
  FORMULA_LINES.clear();               // 重复载入时清掉上一份的缺口清单
  // 结构数学在装载期全量扫描（不能等渲染到那一刻才暴露——t=0 的首屏 render 什么都画不到）
  (data.rows||[]).forEach(r=>{
    if(!r.board||!r.board.content)return;
    String(r.board.content).replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').split('\n')
      .forEach(l=>{const n=normalizeBoardLine(l); if(STRUCT_MATH.test(n))FORMULA_LINES.add(n);});
  });
  const v=validate(data);
  T=0; render(0);
  document.getElementById('meta').textContent=
    'projectCode: '+(data.projectCode||'—')+' · '+(C.rows.length)+' 行 · 合计 '+(C.total/1000).toFixed(1)+'s'
    +(C.guessed?'（⚠ 缺 estimatedDurationMs，已按 160字/分 估算）':'');
  const n=[];
  if(v.e.length)n.push('<span class="warn">❌ 错误 '+v.e.length+' 条：'+v.e.join('；')+'</span>');
  if(v.w.length)n.push('<span class="warn">⚠️ 警告 '+v.w.length+' 条：'+v.w.join('；')+'</span>');
  if(!v.e.length&&!v.w.length)n.push('<span class="ok">✅ 校验通过，符合单手互斥</span>');
  if(FORMULA_LINES.size)n.push('<span class="warn">⚠️ '+FORMULA_LINES.size+
    ' 行含结构数学（\\frac / 上下标），需公式图（当前未接 KaTeX，已原样渲染）：'+
    Array.from(FORMULA_LINES).slice(0,3).map(esc).join(' ／ ')+'</span>');
  n.push('主时钟：'+(hasAudio?'<b class="ok">audio.currentTime</b>':'estimatedDurationMs（可载入音频切换）'));
  n.push('拖动进度条可任意 seek —— render(t) 是纯函数，幂等不漂移。');
  document.getElementById('note').innerHTML=n.join('<br>');
}
document.getElementById('btnPlay').onclick=()=>{playing?pause():play();};
document.getElementById('seek').oninput=e=>{
  if(!C)return; T=C.total*(+e.target.value)/1000;
  if(hasAudio)audioEl.currentTime=T/1000;
  render(T);
};
document.getElementById('btnJson').onclick=()=>document.getElementById('fJson').click();
document.getElementById('fJson').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{try{load(JSON.parse(r.result));}catch(err){alert('JSON 解析失败：'+err.message);}};
  r.readAsText(f,'utf-8');
};
document.getElementById('btnAudio').onclick=()=>document.getElementById('fAudio').click();
document.getElementById('fAudio').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  audioEl.src=URL.createObjectURL(f); hasAudio=true;
  audioEl.onloadedmetadata=()=>{
    const real=audioEl.duration*1000;
    const n=document.getElementById('note').innerHTML;
    document.getElementById('note').innerHTML=n+
      '<br>'+(Math.abs(real-C.total)/real>0.15
        ? '<span class="warn">⚠️ 音频真实时长 '+(real/1000).toFixed(1)+'s 与预估 '+(C.total/1000).toFixed(1)+
          's 偏差 '+Math.round(Math.abs(real-C.total)/real*100)+'%，请核对</span>'
        : '<span class="ok">✅ 音频 '+(real/1000).toFixed(1)+'s 与预估相符</span>');
  };
};
load(DEMO);
// ★ 字体层：CSS @import 只「声明」@font-face，不会为 canvas 触发下载——
//   没有元素用到该字体时浏览器根本不请求它，document.fonts.ready 也会先一步 resolve，
//   于是首帧渲成回退楷体并被行图缓存，之后怎么重绘都是错的。
//   必须显式 document.fonts.load()（旧作 loadStickerFont 同款），加载完再 FONT_VER++ 整批作废缓存。
// ★★ 实测（2026-09-15）：fonts.load 不带 text = 不加载，画面永远停在回退字体。
//   带 text 后实测加载 5 个分片、同文本宽度 228 → 176.1，手写体才真正生效。
function collectBoardText(){
  let s=String((C&&C.data&&C.data.problemText)||'');
  (C&&C.rows?C.rows:[]).forEach(function(r){
    s+=String((r.row&&r.row.speech)||'');
    (r.plan||[]).forEach(function(k){ if(k.type==='board')s+=String(k.content||''); });
  });
  return s.replace(/<[^>]+>/g,'')||'板书';      // 空串会让 load 退化成不加载
}
function warmBoardFonts(){
  if(!document.fonts||!document.fonts.load)return Promise.resolve();
  const txt=collectBoardText();
  return Promise.all([
    document.fonts.load('38px "LikeJianJianTi"',txt)
  ]).catch(function(){}).then(function(){
    FONT_VER++; ROW_CACHE.clear();                   // 字体到位后旧行图全部作废，必须整批重建
    if(C){ render(now()); reportFontState(txt); }
  });
}
// 字体没生效就明说——别让「看着像宋体」变成说不清的玄学
function reportFontState(txt){
  const t=txt.slice(0,12);
  MCTX.font='38px '+HAND_FONT; const a=MCTX.measureText(t).width;
  MCTX.font='38px serif';      const b=MCTX.measureText(t).width;
  if(Math.abs(a-b)<0.5&&C){
    const el=document.getElementById('note');
    if(el)el.innerHTML+='<br><span class="warn">⚠️ 手写字体未生效（渲染宽度与回退字体一致），检查 @import 网络与 fonts.load 的 text 参数</span>';
  }
}
warmBoardFonts();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){
  FONT_VER++; ROW_CACHE.clear();
  if(C)render(now());
});
// 调试/分享入口：#t=毫秒 直接定位到任意时刻（render 纯函数保证画面正确）
(function(){const m=location.hash.match(/t=(\d+)/);if(m&&C){T=Math.min(+m[1],C.total);render(T);}})();
</script>
