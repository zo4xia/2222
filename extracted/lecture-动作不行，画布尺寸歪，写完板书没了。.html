  <style>
    @font-face {

    * { box-sizing: border-box; }

    /* 主画板区 */
    #board-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }
    #board {
      position: relative;
      width: 1726px;
      height: 980px;
      background: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,.12);
      transform-origin: center;
      overflow: hidden;
    }
    #board-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
    .badge {
      position: absolute;
      z-index: 40;
      pointer-events: none;
      user-select: none;
    }
    #topic-badge    { left: 5.7%;  top: 6.6%;  width: 7.1%; }
    #analysis-badge { left: 5.7%;  top: 34.5%; width: 7.2%; }
    #solution-badge { left: 53.7%; top: 6.6%;  width: 7.4%; }
    #summary-badge  { left: 53.7%; top: 62%;   width: 7.2%; }

    .region {
      position: absolute;
      z-index: 10;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #question-region  { left: 6%;    top: 13.32%; width: 40.32%; font-size: 1rem;    font-family: 'Microsoft YaHei', sans-serif; color: #1a1a1a; }

    #summary-region   { left: 54%;   top: 69.5%;  width: 40%;    height: 22%;    font-size: 1.35rem; color: #1a1a1a; }

    #svg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      pointer-events: none;
    }

    /* 板书内容块 */
    .board-content {
      position: absolute;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-weight: 500;
    }
    .board-line {
      display: block;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      transform-origin: left center;
    }
    .board-content .char {
      display: inline-block;
      opacity: 0;
      transition: opacity .06s ease;
    }
    .board-content .char.revealed { opacity: 1; }
    .board-content .newline { display: block; }
    /* 分数 / 上下标（轻量渲染，达芬奇手稿感；5.1：不得单独设 font-family，统一继承预设手写体） */
    .frac { display: inline-flex; flex-direction: column; text-align: center; vertical-align: middle; margin: 0 .12em; line-height: 1.05; }
    .frac > .num { border-bottom: 1.5px solid currentColor; padding: 0 .18em; }  /* 分数线用 currentColor，非印刷体 */
    .frac > .den { padding: 0 .18em; }
    .sup { font-size: .66em; vertical-align: super; }  /* 5.1：仅缩放字号，font-family 继承手写体 */
    .sub { font-size: .66em; vertical-align: sub; }

    /* 下划线目标 */
    .mark-target {
      position: relative;
      display: inline;
    }

    /* 控制面板 */
    #panel {
      flex: 0 0 auto;
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 14px 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;

    #progress-bar {
      flex: 1;
      height: 8px;
      background: #eee;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #c9302c;
      border-radius: 4px;
      transition: width .1s linear;
    }
    #row-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #666;
    }
    #stage-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      background: #f2f2f2;
      color: #333;
      font-weight: 600;
    }
    #speech-text {
      font-size: 18px;
      line-height: 1.6;
      color: #222;
      min-height: 58px;
      padding: 8px 12px;
      background: #fafafa;
      border-radius: 6px;
    }
    #controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    button {
      font-family: inherit;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: #c9302c;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #a82521; }
    button:disabled { background: #bbb; cursor: not-allowed; }
    label { font-size: 14px; color: #555; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    input[type="checkbox"] { width: 16px; height: 16px; }

    #error-tip {
      display: none;
      color: #c9302c;
      font-size: 13px;
      padding: 6px 0;
    }

    /* 5.1 字体硬约束兜底：手写体加载失败时明确报错，禁止静默回退印刷体 */
    #font-error {
      display: none;
      background: #c9302c;
      color: #fff;
      font-size: 15px;
      line-height: 1.5;
      padding: 10px 16px;
      text-align: center;
      position: relative;
      z-index: 999;
    }
  </style>

        分析: "'PingFangHand','PingFang SC',sans-serif",
        解答: "'PingFangHand','PingFang SC',sans-serif",
        总结: "'PingFangHand','PingFang SC',sans-serif",
      };

      function getBoardContainer(index, stage) {
        if (boardContainers[index]) return boardContainers[index];
        const coord = parseCoord(rows[index].board?.startCoord);
        const el = document.createElement('div');
        el.className = 'board-content';
        el.style.color = stageColor[stage] || '#1a1a1a';
        el.style.fontSize = stageRem[stage] || '1.35rem';
        el.style.fontFamily = stageFont[stage] || stageFont['分析'];
        if (coord) {
          el.style.left = coord.x + '%';
          // 达芬奇式弹性收纳：坐标钳入 [3,88]%，保证内容不溢出画布
          el.style.left = Math.min(Math.max(coord.x, 3), 88) + '%';
          el.style.top = Math.min(Math.max(coord.y, 3), 88) + '%';
        } else {
          el.style.left = '6%';
          el.style.top = '6%';
        }
        board.appendChild(el);
        boardContainers[index] = el;
        return el;
      }

      // 逐行书写：行内逐字/逐原子显现；每行轻微倾斜 + 行距 ±10% 抖动 + 逐字位移旋转抖动（老师板书感）
      function writeBoardLine(index, html, stage, durMs) {
        if (!html) return;
        const container = getBoardContainer(index, stage);
        const lineEl = document.createElement('div');
        lineEl.className = 'board-line';
        const tilt = (Math.random() * 3 - 1.5);          // 整行 ±1.5° 轻微倾斜
        const gap = 1.55 * (0.9 + Math.random() * 0.2);  // 行距 ±10% 抖动
        lineEl.style.transform = `rotate(${tilt}deg)`;
        lineEl.style.marginBottom = `${gap}em`;
        lineEl.innerHTML = html;
        container.appendChild(lineEl);

        const chars = Array.from(lineEl.querySelectorAll('.char'));
        if (!chars.length) return;
        const base = durMs / Math.max(chars.length, 1);
        chars.forEach((span, i) => {
          const jx = (Math.random() * 2 - 1);   // ±1px 位移
          const jy = (Math.random() * 2 - 1);
          const rot = (Math.random() * 2 - 1);  // ±1° 旋转
          span.style.transform = `translate(${jx}px, ${jy}px) rotate(${rot}deg)`;
          const jitter = base * 0.08 * (Math.random() - 0.5);
          const t = setTimeout(() => span.classList.add('revealed'), Math.max(0, i * base + jitter));
          timers.push(t);
        });
      }

      function executeAction(action) {
        if (!action || !action.tool) return;
        if (action.tool === 'rough-notation') {
          doUnderline(action);
        } else if (action.tool === 'rough-line' || action.tool === 'rough-rough-line') {
          doLine(action, false);
        } else if (action.tool === 'rough-arrow') {
          doLine(action, true);
        }
      }

      function doUnderline(action) {
        const target = action.target;
        if (!target || !target.exactText) return;
        const regionEl = regions[target.region === 'question' ? '题目' : target.region];
        if (!regionEl) return;
        // 找目标 span（按文本匹配第一个）
        const spans = Array.from(regionEl.querySelectorAll('.mark-target'));
        const el = spans.find(s => s.textContent.includes(target.exactText));
        if (!el) return;
        const annotate = window.RoughNotation?.annotate || window.annotate;
        if (!annotate) return;
        const color = action.options?.color || '#d64545';
        const width = action.options?.strokeWidth || 2;
        const an = annotate(el, {
          type: action.action || 'underline',
          color,
          strokeWidth: width,
          iterations: action.options?.iterations || 2,
          multiline: action.options?.multiline ?? false,
          padding: action.options?.padding ?? 2,
          animationDuration: 1200,
        });
        an.show();
        annotations.push(an);
      }

      function doLine(action, withArrow) {
        const { start, end, style } = action;
        if (!start || !end) return;
        const size = getBoardSize();
        const x1 = pctToPx(start[0], size.w);
        const y1 = pctToPx(start[1], size.h);
        const x2 = pctToPx(end[0], size.w);
        const y2 = pctToPx(end[1], size.h);

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        svgOverlay.appendChild(g);

        const rc = rough.svg(svgOverlay);
        const color = style?.colorId === 'red' ? '#c9302c' : (style?.colorId === 'ink' ? '#1a1a1a' : '#1a1a1a');
        const width = style?.strokeWidthId === 'emphasis' ? 3 : 2;

        const path = rc.linearPath([[x1, y1], [x2, y2]], {
          stroke: color,
          strokeWidth: width,
          roughness: 1.2,
          bowing: 1.2,
        });
        g.appendChild(path);

        if (withArrow) {
          const angle = Math.atan2(y2 - y1, x2 - x1);
          const len = 14;
          const a1 = angle + Math.PI * 0.85;
          const a2 = angle - Math.PI * 0.85;
          const arrPath = rc.linearPath([
            [x2, y2],
            [x2 + len * Math.cos(a1), y2 + len * Math.sin(a1)],
            [x2, y2],
            [x2 + len * Math.cos(a2), y2 + len * Math.sin(a2)],
          ], { stroke: color, strokeWidth: width, roughness: 1.2 });
          g.appendChild(arrPath);
        }

        animatePath(path);
      }

      function animatePath(node) {
        const path = node.tagName === 'path' ? node : node.querySelector('path');
        if (!path || typeof path.getTotalLength !== 'function') return;
        try {
          const len = path.getTotalLength();
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
          path.getBoundingClientRect(); // force reflow
          path.style.transition = 'stroke-dashoffset 1.2s ease-out';
          path.style.strokeDashoffset = '0';
        } catch (e) { console.warn('路径动画失败', e); }
      }

      function updateProgress() {
        if (!isPlaying || isPaused) return;
        const now = performance.now();
        const elapsed = pauseOffset + (now - startTime);
        const pct = totalDuration ? Math.min(100, (elapsed / totalDuration) * 100) : 0;
        progressFill.style.width = pct + '%';
        timeDisplay.textContent = `${formatTime(elapsed)} / ${formatTime(totalDuration)}`;
        rafId = requestAnimationFrame(updateProgress);
      }

      function finish() {
        isPlaying = false;
        btnPlay.disabled = false;
        btnPause.disabled = true;
        progressFill.style.width = '100%';
        timeDisplay.textContent = `${formatTime(totalDuration)} / ${formatTime(totalDuration)}`;
        speechEl.textContent = '讲学结束。';
        stageBadge.textContent = '完成';
      }

      function play() {
        if (isPlaying) return;
        if (currentRow === -1 || currentRow >= rows.length) {
          reset();
          isPlaying = true;
          startTime = performance.now();
          pauseOffset = 0;
          playRow(0);
        } else {
          isPlaying = true;
          startTime = performance.now();
          // 重新调度剩余行（简化：从当前行开头重播）
          clearAll();
          playRow(currentRow);
        }
        btnPlay.disabled = true;
        btnPause.disabled = false;
        rafId = requestAnimationFrame(updateProgress);
      }

      function pause() {
        if (!isPlaying) return;
        isPlaying = false;
        isPaused = true;
        pauseOffset += performance.now() - startTime;
        clearAll();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        btnPlay.disabled = false;
        btnPause.disabled = true;
        if (rafId) cancelAnimationFrame(rafId);
      }

      btnPlay.addEventListener('click', play);
      btnPause.addEventListener('click', pause);
      btnRestart.addEventListener('click', () => { reset(); play(); });

      document.getElementById('progress-bar').addEventListener('click', (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        const targetMs = ratio * totalDuration;
        // 定位到最近的一行开头（精确seek复杂，先按行）
        let idx = rowStartTimes.findIndex((t, i) => (rowStartTimes[i+1] ?? totalDuration) > targetMs);
        if (idx < 0) idx = 0;
        reset();
        currentRow = idx;
        pauseOffset = rowStartTimes[idx];
        play();
      });

      reset();
    })();
  </script>
</body>
